<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luma Office</title><style>
:root{color-scheme:light;--bg:#f3f5f7;--panel:#fff;--line:#d7dce2;--text:#242424;--muted:#656b73;--excel:#217346;--excel-dark:#185c37;--select:#107c41}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px "Segoe UI",Arial,"Malgun Gothic",sans-serif}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--excel);color:#fff;position:sticky;top:0;z-index:5;min-height:56px;box-shadow:0 1px 3px #0002}
.logo{font-size:20px;font-weight:700;letter-spacing:-.4px}.logo b{color:#fff}.sub{color:#e1efe6;font-size:11px;margin-top:2px}
.top button{background:#fff1;color:#fff;border-color:#ffffff55}
.ribbon-tabs{display:flex;align-items:center;gap:0;padding:0 14px;background:#fff;border-bottom:1px solid #c9cdd2;overflow-x:auto;white-space:nowrap;position:sticky;top:56px;z-index:4}
.ribbon-tab{border:0!important;border-radius:0!important;background:transparent!important;color:#3b3b3b!important;padding:12px 15px!important;position:relative;font-size:13px}
.ribbon-tab.active{color:var(--excel)!important;font-weight:700}.ribbon-tab.active:after{content:"";height:3px;background:var(--excel);position:absolute;left:10px;right:10px;bottom:0}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 14px;background:#fff;border-bottom:1px solid #c9cdd2;min-height:76px}
.tool-group{display:flex;align-items:center;gap:5px;padding:0 10px;border-right:1px solid #e1e4e8;min-height:48px}.tool-group:last-child{border-right:0}.ribbon-file{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-left:1px solid #e1e4e8}.no-grid td,.no-grid th{border-color:transparent}.toolbar{min-height:64px}.group-label{display:none}.toolbar .tool-group{gap:6px;padding:0 9px}.toolbar button{min-height:34px}.group-label{font-size:10px;color:#72777d;text-align:center;margin-top:3px}
button,select,input{background:#fff;color:var(--text);border:1px solid #c8cdd2;border-radius:3px;padding:7px 10px;font:inherit}
button{cursor:pointer}button:hover{background:#eaf3ed;border-color:#9ab9a5}button:focus-visible,input:focus-visible{outline:2px solid #26834a;outline-offset:1px}
button.primary{background:var(--excel);color:#fff;border-color:var(--excel);font-weight:600}
.ribbon-tabs button{box-shadow:none}.formula{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid #c9cdd2}
#address{width:82px;text-align:center}#formula{flex:1;min-width:0}#apply{background:#f7f8f9}
.wrap{overflow:auto;height:calc(100dvh - 235px);background:#fff}
table{border-collapse:separate;border-spacing:0;min-width:100%;table-layout:fixed}
th,td{border-right:1px solid #e1e4e8;border-bottom:1px solid #e1e4e8;height:27px;min-width:100px;padding:0}td.cell{overflow:visible}td.cell input{color:inherit;font:inherit;text-align:inherit}td.cell input[style*="background-color"]{background:inherit}
th{background:#f2f4f6;color:#444;font-weight:500;text-align:center;position:sticky;top:0;z-index:1}
th:first-child{left:0;z-index:3;min-width:48px;width:48px}
td.rowhead{position:sticky;left:0;background:#f2f4f6;color:#5c6269;text-align:center;min-width:48px;width:48px;font-size:12px}
td.cell{background:#fff;padding:0}#wrap{position:relative}#excelImages{position:absolute;left:0;top:0;z-index:6;pointer-events:none;overflow:visible}#excelImages img{position:absolute;object-fit:fill;max-width:none;pointer-events:none}td.cell input{width:100%;height:26px;padding:3px 7px;border:0;border-radius:0;background:transparent;outline:none}
td.cell input:focus{box-shadow:inset 0 0 0 2px #217346;background:#fff}
td.cell input.bold{font-weight:700}td.cell input.italic{font-style:italic}
.tabs{display:flex;gap:3px;padding:6px 12px;border-top:1px solid #c9cdd2;background:#f7f8f9;overflow:auto}
.tab{white-space:nowrap;border:0;border-radius:0;background:transparent;padding:8px 14px}.tab.primary{background:#fff;color:var(--excel);border-bottom:3px solid var(--excel);border-radius:0}
.status{padding:5px 12px;background:var(--excel);color:#fff;font-size:11px;min-height:24px}
@media(max-width:600px){.top{padding:9px 12px;top:0}.ribbon-tabs{top:54px;padding:0 4px}.ribbon-tab{padding:11px 12px!important}.toolbar{gap:4px;padding:7px}.tool-group{padding:0 5px;gap:4px}.toolbar button{padding:7px 8px}.wrap{height:calc(100dvh - 275px)}.formula{padding:7px}.sub{display:none}}
</style></head><body><header class="top"><div><div class="logo">▦ Luma <b>Office</b></div><div class="sub">스프레드시트 · 저장소 기반 웹 앱</div></div><div style="margin-left:auto;display:flex;gap:6px"><button id="newSheet">＋ 시트 추가</button></div></header><nav class="ribbon-tabs" aria-label="리본 메뉴">
<button class="ribbon-tab active" data-ribbon="파일">파일</button><button class="ribbon-tab" data-ribbon="홈">홈</button><button class="ribbon-tab" data-ribbon="삽입">삽입</button><button class="ribbon-tab" data-ribbon="페이지 레이아웃">페이지 레이아웃</button><button class="ribbon-tab" data-ribbon="수식">수식</button><button class="ribbon-tab" data-ribbon="데이터">데이터</button><button class="ribbon-tab" data-ribbon="검토">검토</button><button class="ribbon-tab" data-ribbon="보기">보기</button>
</nav><nav class="toolbar" id="toolbar" aria-label="선택한 메뉴 기능"></nav><div id="legacy-controls" hidden><button id="new"></button><button id="bold"></button><button id="italic"></button><button id="sum"></button><button id="undo"></button><button id="redo"></button><button id="download"></button></div><div class="formula"><input id="address" value="A1" aria-label="셀 주소"><span style="align-self:center;color:var(--muted)">fx</span><input id="formula" placeholder="값 또는 수식 입력 (예: =SUM(A1:A5))" aria-label="수식 입력"><button id="apply">적용</button></div><main class="wrap" id="wrap"><table id="grid"></table></main><div class="tabs" id="tabs"></div><div class="status" id="status">준비됨 · 셀을 선택하고 입력하세요. 수식: =A1+B1, =SUM(A1:A5), =AVERAGE(), =MIN(), =MAX(), =COUNT()</div><script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script><script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script><script>

const ribbonDefs={
'파일':[['새로 만들기','새 문서'],['열기','Excel/CSV 열기'],['저장','XLSX로 내보내기'],['CSV 내보내기','CSV 내보내기']],
'홈':[['실행 취소','실행 취소'],['다시 실행','다시 실행'],['범위 복사','범위 복사'],['굵게','B'],['기울임','I'],['밑줄','밑줄'],['글꼴 크기','글꼴 크기'],['가운데 정렬','가운데 정렬'],['왼쪽 정렬','왼쪽 정렬'],['오른쪽 정렬','오른쪽 정렬'],['줄 바꿈','줄 바꿈'],['배경색','배경색'],['글자색','글자색'],['테두리','테두리'],['숫자 형식','숫자 형식'],['합계','Σ 합계'],['찾기','찾기'],['바꾸기','바꾸기'],['지우기','내용 지우기'],['서식 지우기','서식 지우기']],
'삽입':[['새 시트','시트 추가'],['행 삽입','행 추가'],['열 삽입','열 추가'],['행 삭제','행 삭제'],['열 삭제','열 삭제'],['셀 병합/해제','셀 병합/해제'],['하이퍼링크','하이퍼링크'],['행 높이','행 높이'],['열 너비','열 너비'],['차트 삽입','차트 삽입'],['표 스타일','표 스타일']],
'페이지 레이아웃':[['그리드라인','눈금선 표시'],['배율 100%','배율 100%'],['방향','인쇄 방향']],
'수식':[['합계 SUM','SUM 함수'],['평균 AVERAGE','AVERAGE 함수'],['최솟값 MIN','MIN 함수'],['최댓값 MAX','MAX 함수'],['개수 COUNT','COUNT 함수'],['비어 있지 않은 개수 COUNTA','COUNTA 함수'],['조건 합계 SUMIF','SUMIF 함수'],['조건 개수 COUNTIF','COUNTIF 함수'],['조건 IF','IF 함수'],['반올림 ROUND','ROUND 함수'],['절댓값 ABS','ABS 함수'],['문자 길이 LEN','LEN 함수'],['대문자 UPPER','UPPER 함수'],['소문자 LOWER','LOWER 함수'],['오늘 날짜 TODAY','TODAY 함수'],['수식 표시 전환','수식 표시 전환'],['수식 다시 계산','다시 계산']],
'데이터':[['정렬 오름차순','오름차순 정렬'],['정렬 내림차순','내림차순 정렬'],['자동 필터','자동 필터'],['필터 해제','필터 해제'],['중복 제거','중복 제거'],['텍스트 나누기','텍스트 나누기'],['데이터 유효성 검사','데이터 유효성 검사'],['조건부 서식','조건부 서식'],['CSV/Excel 가져오기','Excel/CSV 열기']],
'검토':[['셀 메모','셀 메모'],['시트 이름 변경','시트 이름 변경'],['시트 삭제','시트 삭제']],
'보기':[['수식 입력줄','수식 입력줄 표시'],['전체 화면 격자','전체 화면 격자'],['확대','확대'],['축소','축소'],['고정 창','고정 창'],['고정 창 해제','고정 창 해제'],['인쇄 미리보기','인쇄 미리보기']]
};
function drawRibbon(name){
 document.querySelectorAll('[data-ribbon]').forEach(b=>b.classList.toggle('active',b.dataset.ribbon===name));
 const bar=document.querySelector('#toolbar');
 if(name==='파일'){
 bar.innerHTML='<div class="tool-group"><div><button class="primary" data-action="새 문서">새로 만들기</button><div class="group-label">통합 문서</div></div><div><button data-action="Excel/CSV 열기">열기</button><div class="group-label">기존 파일</div></div><div><button data-action="XLSX로 내보내기">Excel 통합 문서 저장</button><div class="group-label">저장</div></div><div><button data-action="CSV 내보내기">CSV 내보내기</button><div class="group-label">내보내기</div></div><label class="ribbon-file">열기 <input type="file" id="upload" accept=".csv,.xlsx,.xls,.xlsm,text/csv" style="max-width:180px"></label></div>';
 } else {
 bar.innerHTML='';
 const groups={};
 (ribbonDefs[name]||[]).forEach(([label,action])=>{
 const g=(action==='B'||action==='I')?'글꼴':(['실행 취소','다시 실행','새 문서','시트 추가'].includes(action)?'실행':'도구');
 (groups[g]??=[]).push([label,action]);
 });
 Object.entries(groups).forEach(([g,items])=>{
 const el=document.createElement('div');el.className='tool-group';
 items.forEach(([label,action])=>{const b=document.createElement('button');b.textContent=label;b.dataset.action=action;el.appendChild(b)});
 const cap=document.createElement('div');cap.className='group-label';cap.textContent=g;el.appendChild(cap);bar.appendChild(el);
 });
 }
 bar.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>runAction(b.dataset.action)));
 const up=bar.querySelector('#upload');if(up)up.addEventListener('change',importFile);
}
function runAction(a){
 if(a==='새 문서'){if(confirm('새 통합 문서를 만들까요?')){snapshot();sheets=[{name:'시트1',data:{}}];active=0;selected='A1';render();status.textContent='새 통합 문서';}}
 else if(a==='Excel/CSV 열기'){const up=document.querySelector('#toolbar #upload');if(up)up.click();else{drawRibbon('파일');document.querySelector('#toolbar #upload')?.click();}}
 else if(a==='XLSX로 내보내기')exportXlsx();
 else if(a==='CSV 내보내기')document.querySelector('#download').click();
 else if(a==='가운데 정렬'||a==='왼쪽 정렬'){snapshot();const s=data()[selected+'::style']||{};s.alignment={...(s.alignment||{}),horizontal:a==='가운데 정렬'?'center':'left'};data()[selected+'::style']=s;render();}
 else if(a==='배경색'){const color=prompt('셀 배경색 HEX 입력 (예: #B4C7E7)','#B4C7E7');if(color&&/^#[0-9a-f]{6}$/i.test(color)){snapshot();const s=data()[selected+'::style']||{};s.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+color.slice(1).toUpperCase()}};data()[selected+'::style']=s;render();}}
 else if(a==='글자색'){const color=prompt('글자색 HEX 입력 (예: #C00000)','#C00000');if(color&&/^#[0-9a-f]{6}$/i.test(color)){snapshot();const s=data()[selected+'::style']||{};s.font={...(s.font||{}),color:{argb:'FF'+color.slice(1).toUpperCase()}};data()[selected+'::style']=s;render();}}
 else if(a==='테두리'){const side=prompt('적용할 테두리: 전체 / 바깥 / 아래 / 위 / 왼쪽 / 오른쪽','전체');if(side){snapshot();const s=data()[selected+'::style']||{};s.border=s.border||{};const b={style:'thin',color:{argb:'FF000000'}};if(side==='전체'||side==='바깥')for(const k of ['top','bottom','left','right'])s.border[k]=b;else ({'아래':'bottom','위':'top','왼쪽':'left','오른쪽':'right'}[side]&&(s.border[({'아래':'bottom','위':'top','왼쪽':'left','오른쪽':'right'})[side]]=b));data()[selected+'::style']=s;render();}}
 else if(a==='셀 병합/해제'){const p=parse(selected),existing=(sheets[active].merges||[]).find(m=>p.r>=m.s.r+1&&p.r<=m.e.r+1&&p.c>=m.s.c+1&&p.c<=m.e.c+1);if(existing){sheets[active].merges=sheets[active].merges.filter(m=>m!==existing);}else{const range=prompt('병합 범위 입력 (예: A1:C1)','A1:C1');if(range){const m=/^([A-Z]+\\d+):([A-Z]+\\d+)$/i.exec(range);if(m){const p1=parse(m[1].toUpperCase()),p2=parse(m[2].toUpperCase());sheets[active].merges=sheets[active].merges||[];sheets[active].merges.push({s:{r:Math.min(p1.r,p2.r)-1,c:Math.min(p1.c,p2.c)-1},e:{r:Math.max(p1.r,p2.r)-1,c:Math.max(p1.c,p2.c)-1}});}}}render();}
 else if(a==='행 높이'){const p=parse(selected),n=Number(prompt('행 높이(pt)',String(sheets[active].rows?.[p.r-1]?.height||20)));if(n>0){sheets[active].rows=sheets[active].rows||[];sheets[active].rows[p.r-1]={...(sheets[active].rows[p.r-1]||{}),height:n};render();}}
 else if(a==='열 너비'){const p=parse(selected),n=Number(prompt('열 너비(문자 단위)',String(sheets[active].cols?.[p.c-1]?.width||14)));if(n>0){sheets[active].cols=sheets[active].cols||[];sheets[active].cols[p.c-1]={...(sheets[active].cols[p.c-1]||{}),width:n};render();}}
 else if(a==='필터 해제'){grid.querySelectorAll('tbody tr').forEach(tr=>tr.hidden=false);status.textContent='필터 해제';}
 else if(a==='중복 제거'){const p=parse(selected),seen=new Set();snapshot();for(let r=p.r;r<=R;r++){const key=String(raw(addr(r,p.c)));if(seen.has(key))delete data()[addr(r,p.c)];else seen.add(key)}render();status.textContent='선택 열의 중복값 제거 완료';}
 else if(a==='고정 창 해제'){document.querySelectorAll('th').forEach(th=>th.style.position='sticky');status.textContent='행/열 머리글 고정은 기본 표시 상태입니다.';}
 else if(a==='고정 창'){alert('현재 선택 셀 기준 고정 창은 다음 업데이트에서 구현 예정입니다.');}
 else if(a==='밑줄'){snapshot();const s=data()[selected+'::style']||{};s.font={...(s.font||{}),underline:!s.font?.underline};data()[selected+'::style']=s;render();}
 else if(a==='글꼴 크기'){const n=Number(prompt('글꼴 크기(pt)','11'));if(n>0&&n<100){snapshot();const s=data()[selected+'::style']||{};s.font={...(s.font||{}),size:n,sz:n};data()[selected+'::style']=s;render();}}
 else if(a==='오른쪽 정렬'){snapshot();const s=data()[selected+'::style']||{};s.alignment={...(s.alignment||{}),horizontal:'right'};data()[selected+'::style']=s;render();}
 else if(a==='줄 바꿈'){snapshot();const s=data()[selected+'::style']||{};s.alignment={...(s.alignment||{}),wrapText:!s.alignment?.wrapText};data()[selected+'::style']=s;render();}
 else if(a==='숫자 형식'){const z=prompt('형식 코드 (일반: General, 숫자: #,##0.00, 통화: ₩#,##0)','#,##0.00');if(z){snapshot();data()[selected+'::numFmt']=z;render();}}
 else if(a==='서식 지우기'){snapshot();delete data()[selected+'::style'];delete data()[selected+'::bold'];delete data()[selected+'::italic'];delete data()[selected+'::numFmt'];render();}
 else if(a==='바꾸기'){const q=prompt('찾을 텍스트');if(q!==null&&q!==''){const rep=prompt('바꿀 텍스트','')??'';snapshot();for(const k of Object.keys(data()))if(!k.includes('::')&&typeof data()[k]==='string')data()[k]=data()[k].split(q).join(rep);render();}}
 else if(a==='하이퍼링크'){const url=prompt('링크 주소 (https://...)');if(url){snapshot();data()[selected+'::hyperlink']=url;data()[selected]=String(raw(selected)||url);render();}}
 else if(a==='인쇄 미리보기'||a==='인쇄'){window.print();}
 else if(a==='텍스트 나누기'){const sep=prompt('구분 문자 입력 (예: , 또는 공백)',',');if(sep){const p=parse(selected),n=Math.max(1,Number(prompt('나눌 열 개수','3'))||3);snapshot();for(let rr=p.r;rr<=R;rr++){const parts=String(raw(addr(rr,p.c))||'').split(sep);parts.slice(0,n).forEach((x,i)=>{data()[addr(rr,p.c+i)]=x;});}C=Math.max(C,p.c+n-1);render();}}
 else if(a==='시트 삭제'){if(sheets.length>1&&confirm('현재 시트를 삭제할까요?')){sheets.splice(active,1);active=Math.max(0,active-1);selected='A1';render();}}
 else if(a==='SUMIF 함수'){formula.value='=SUMIF(A1:A10,"조건",B1:B10)';status.textContent='SUMIF 수식 템플릿이 입력되었습니다. 조건과 범위를 수정하세요.';}
 else if(a==='IF 함수'){formula.value='=IF(A1>0,"참","거짓")';status.textContent='IF 수식 템플릿이 입력되었습니다. 적용 전 수식을 확인하세요.';}
 else if(a==='ROUND 함수'){formula.value='=ROUND(A1,2)';status.textContent='ROUND 수식 템플릿이 입력되었습니다. 적용 전 수식을 확인하세요.';}
 else if(a==='COUNTIF 함수'){formula.value='=COUNTIF(A1:A10,\">0\")';status.textContent='COUNTIF 수식 템플릿이 입력되었습니다.';}

function snapshot(){undoStack.push(JSON.stringify(sheets));if(undoStack.length>100)undoStack.shift();redoStack=[]}
function persistWorkbook(){try{localStorage.setItem('luma-office-autosave',JSON.stringify({sheets,R,C,active,selected}));}catch(e){status.textContent='자동 저장 공간이 부족합니다. XLSX로 저장해 주세요.';}}
function colName(n){let s='';while(n){let r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s}
function themeColor(c){if(!c)return '';if(c.rgb||c.argb)return '#'+String(c.rgb||c.argb).slice(-6);if(Number.isInteger(c.theme)){const p=['FFFFFF','000000','E7E6E6','44546A','4472C4','ED7D31','A5A5A5','FFC000','5B9BD5','70AD47','0563C1','954F72'];let hex=p[c.theme]||'';if(!hex)return '';let t=Number(c.tint||0);if(t){let n=parseInt(hex,16),r=n>>16&255,g=n>>8&255,b=n&255;if(t>0){r=Math.round(r+(255-r)*t);g=Math.round(g+(255-g)*t);b=Math.round(b+(255-b)*t)}else{r=Math.round(r*(1+t));g=Math.round(g*(1+t));b=Math.round(b*(1+t))}hex=[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase()}return '#'+hex}if(Number.isInteger(c.indexed)){const p=['000000','FFFFFF','FF0000','00FF00','0000FF','FFFF00','FF00FF','00FFFF','000000','FFFFFF','FF0000','00FF00','0000FF','FFFF00','FF00FF','00FFFF'];return p[c.indexed]?'#'+p[c.indexed]:''}return ''}function styleCss(s,includeBorders=true){if(!s)return '';let out=[];const f=s.font||{},fill=s.fill||{},al=s.alignment||{},bd=s.border||{};if(f.bold)out.push('font-weight:bold');if(f.italic)out.push('font-style:italic');if(f.underline)out.push('text-decoration:underline');if(f.sz)out.push('font-size:'+f.sz+'pt');const fontColor=themeColor(f.color);if(fontColor)out.push('color:'+fontColor);const fc=themeColor(fill.fgColor)||themeColor(fill.bgColor);if(fc&&fill.pattern!=='none')out.push('background-color:'+fc);if(al.horizontal)out.push('text-align:'+({'center':'center','right':'right','left':'left','justify':'justify'}[al.horizontal]||'left'));if(al.vertical)out.push('vertical-align:'+({'center':'middle','top':'top','bottom':'bottom'}[al.vertical]||'middle'));if(al.wrapText)out.push('white-space:normal');if(includeBorders)for(const [k,side] of [['top',bd.top],['bottom',bd.bottom],['left',bd.left],['right',bd.right]])if(side&&side.style){const bs=side.style;const width=({'hair':1,'thin':1,'dotted':1,'dashDot':1,'dashed':1,'medium':2,'mediumDashed':2,'mediumDashDot':2,'mediumDashDotDot':2,'slantDashDot':2,'thick':3,'double':3}[bs]||1 function coveredByMerge(a){const p=parse(a);return (sheets[active].merges||[]).some(m=>p.r>m.s.r+1&&p.r<=m.e.r+1&&p.c>=m.s.c+1&&p.c<=m.e.c+1 || p.r===m.s.r+1&&p.c>m.s.c+1&&p.c<=m.e.c+1)}
function render(){const cols=lettersFor(C);let head='<thead><tr><th></th>'+cols.map((x,i)=>'<th style="'+(sheets[active].cols?.[i]?.wpx?'width:'+sheets[active].cols[i].wpx+'px;':sheets[active].cols?.[i]?.width?'width:'+(sheets[active].cols[i].width*7)+'px;':sheets[active].cols?.[i]?.wch?'width:'+(sheets[active].cols[i].wch*7)+'px;':'')+'">'+x+'</th>').join('')+'</tr></thead>';let body='';for(let r=1;r<=R;r++){body+='<tr style="'+(sheets[active].rows?.[r-1]?.hpx?'height:'+sheets[active].rows[r-1].hpx+'px;':sheets[active].rows?.[r-1]?.height?'height:'+(sheets[active].rows[r-1].height*1.333)+'px;':'')+'"><td class="rowhead">'+r+'</td>';for(let c=1;c<=C;c++){const a=addr(r,c);if(coveredByMerge(a))continue;const p=parse(a),merge=(sheets[active].merges||[]).find(m=>p.r===m.s.r+1&&p.c===m.s.c+1);const cs=merge?merge.e.c-merge.s.c+1:1,rs=merge?merge.e.r-merge.s.r+1:1;const v=displayVal(a);let sty=data()[a+'::style'];const cr=data()[a+'::conditional'];if(cr){const n=Number(v),t=Number(cr.threshold);const ok=cr.op==='숫자보다 큼'?n>t:cr.op==='숫자보다 작음'?n<t:String(v??'').includes(cr.threshold);if(ok)sty={...(sty||{}),fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FFFFC7CE'}}};}const cellImages='';body+='<td class="cell" '+(cs>1?'colspan="'+cs+'" ':'')+(rs>1?'rowspan="'+rs+'" ':'')+'style="position:relative;'+styleCss(sty)+'"><input data-cell="'+a+'" aria-label="'+a+'" value="'+esc(v??'')+'" style="'+styleCss(sty,false)+'" class="'+(data()[a+'::bold']?'bold ':'')+(data()[a+'::italic']?'italic':'')+'">'+cellImages+'</td>';}body+='</tr>';}grid.innerHTML=head+'<tbody>'+body+'</tbody>';renderImages();grid.querySelectorAll('[data-cell]').forEach(el=>{el.addEventListener('focus',()=>select(el.dataset.cell,el));el.addEventListener('input',()=>{data()[el.dataset.cell]=el.value;formula.value=el.value;try{localStorage.setItem('luma-office-autosave',JSON.stringify({sheets,R,C,active,selected}));}catch{}});el.addEventListener('change',()=>{status.textContent=el.dataset.cell+' 편집됨';renderVal function renderImages(){let layer=document.querySelector('#excelImages');if(!layer){layer=document.createElement('div');layer.id='excelImages';document.querySelector('#wrap').appendChild(layer)}layer.innerHTML='';const wrap=document.querySelector('#wrap'),wr=wrap.getBoundingClientRect();layer.style.width=Math.max(grid.scrollWidth,wrap.clientWidth)+'px';layer.style.height=Math.max(grid.scrollHeight,wrap.clientHeight)+'px';const imgs=sheets[active].images||[];imgs.forEach((im)=>{if(!im.src||!im.tl)return;const sc=Math.max(0,Math.floor(im.tl.col))+1,sr=Math.max(0,Math.floor(im.tl.row))+1;const start=grid.querySelector('[data-cell="'+addr(sr,sc)+'"]');if(!start)return;const cr=start.getBoundingClientRect();const x=cr.left-wr.left+wrap.scrollLeft+(im.tl.col-Math.floor(im.tl.col))*cr.width+((im.tl.colOff||0)/9525);const y=cr.top-wr.top+wrap.scrollTop+(im.tl.row-Math.floor(im.tl.row))*cr.height+((im.tl.rowOff||0)/9525);let w=im.ext&&im.ext.width?im.ext.width:180,h=im.ext&&im.ext.height?im.ext.height:100;if(im.br){const ec=Math.max(1,Math.floor(im.br.col))+1,er=Math.max(1,Math.floor(im.br.row))+1;const end=grid.querySelector('[data-cell="'+addr(er,ec)+'"]');if(end){const erc=end.getBoundingClientRect();w=(erc.left-wr.left+wrap.scrollLeft+(im.br.col-Math.floor(im.br.col))*erc.width+((im.br.colOff||0)/9525))-x;h=(erc.top-wr.top+wrap.scrollTop+(im.br.row-Math.floor(im.br.row))*erc.height+((im.br.rowOff||0)/9525))-y}}const img=document.createElement('img');img.alt='Excel embedded image';img.src=im.src;img.style.left=x+'px';img.style.top=y+'px';img.style.width=Math.max(1,w)+'px';img.style.height=Math.max(1,h)+'px';layer.appendChild(img)})}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}function renderValues(){grid.querySelectorAll('[data-cell]').forEach(el=>{if(el!==document.activeElement)el.value=val(el.dataset.cell)??''})}
function select(a,el){selected=a;address.value=a;let e=el||grid.querySelector('[data-cell="'+a+'"]');currentInput=e||null;formula.value=raw(a);if(e)e.focus({preventScroll:true})}

function parseRange(text){const m=/^\s*([A-Z]+\d+)\s*:\s*([A-Z]+\d+)\s*$/i.exec(text||'');if(!m)return null;const p=parse(m[1].toUpperCase()),q=parse(m[2].toUpperCase());return {r1:Math.min(p.r,q.r),c1:Math.min(p.c,q.c),r2:Math.max(p.r,q.r),c2:Math.max(p.c,q.c)}}
function copyRange(){const range=prompt('복사 범위 입력 (예: A1:C5)',selected);if(!range)return;const rg=parseRange(range)||(()=>{const p=parse(range.toUpperCase());return p?{r1:p.r,c1:p.c,r2:p.r,c2:p.c}:null})();if(!rg){alert('셀 범위를 확인하세요.');return;}const lines=[];for(let rr=rg.r1;rr<=rg.r2;rr++){const row=[];for(let cc=rg.c1;cc<=rg.c2;cc++)row.push(String(raw(addr(rr,cc))??'').replace(/\t/g,' ').replace(/\r?\n/g,' '));lines.push(row.join('\t'));}const txt=lines.join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>status.textContent='범위를 클립보드에 복사했습니다.').catch(()=>prompt('아래 내용을 복사하세요',txt));else prompt('아래 내용을 복사하세요',txt)}
function pasteMatrix(text){const rows=parseCsvTab(text);if(!rows.length)return;const p=parse(selected);snapshot();rows.forEach((row,ri)=>row.forEach((v,ci)=>{const a=addr(p.r+ri,p.c+ci);data()[a]=v;}));R=Math.max(R,p.r+rows.length-1);C=Math.max(C,p.c+Math.max(...rows.map(x=>x.length))-1);render();select(selected);status.textContent='클립보드 범위 붙여넣기 완료'}
function parseCsvTab(text){const rows=[];let row=[],v='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'&&text[i+1]==='"'){v+='"';i++}else if(ch==='"')q=false;else v+=ch;}else if(ch==='"')q=true;else if(ch==='\t'){row.push(v);v=''}else if(ch==='\n'){row.push(v.replace(/\r$/,''));rows.push(row);row=[];v=''}else v+=ch;}row.push(v.replace(/\r$/,''));if(row.length>1||row[0]!=='')rows.push(row);return rows}
