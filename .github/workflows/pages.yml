name: Deploy Luma Office to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [];
          let cursor = 0;
          while ((cursor = html.indexOf('<script', cursor)) !== -1) {
            const open = html.indexOf('>', cursor);
            const close = html.indexOf('</script>', open + 1);
            if (open < 0 || close < 0) throw new Error('Malformed script tag');
            const source = html.slice(open + 1, close);
            if (source.trim()) scripts.push(source);
            cursor = close + 9;
          }
          if (!scripts.length) throw new Error('No inline JavaScript found');
          scripts.forEach((source, index) => {
            new Function(source);
            console.log('Inline script ' + (index + 1) + ': syntax OK');
          });
          NODE
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
